[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "F841",   # local variable assigned but never used (some intentional)
]

[tool.ruff.lint.isort]
known-first-party = ["vapix", "config"]
