name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t vapx-mcp-test .

      - name: Run tests
        run: docker run --rm vapx-mcp-test -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --target production -t vapx-mcp .

      - name: Verify server starts
        run: |
          docker run --rm -d --name vapx-test vapx-mcp --transport stdio &
          sleep 2
          docker stop vapx-test 2>/dev/null || true
