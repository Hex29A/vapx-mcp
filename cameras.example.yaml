# Example camera configuration for VPX MCP Server
#
# Copy this file to cameras.yaml and fill in your camera details.
# Passwords can reference environment variables with ${ENV_VAR} syntax.
#
# Available capabilities:
#   snapshot, ptz, io, light, overlay, vmd, guard_tour, siren,
#   storage, clear_view, privacy_mask, time, daynight,
#   stream_profiles, geolocation, audio, events,
#   capture_mode, orientation, analytics_metadata
#
# Use "auto" to auto-detect capabilities via the API Discovery endpoint.

cameras:
  - id: front-door
    name: "Front Door Camera"
    host: "192.168.1.100"
    port: 443
    https: true
    verify_ssl: false
    username: "root"
    password: "${FRONT_DOOR_PASS}"
    capabilities:
      - snapshot
      - ptz
      - events
      - io
      - light
      - storage

  - id: backyard
    name: "Backyard Camera"
    host: "192.168.1.101"
    port: 443
    https: true
    verify_ssl: false
    username: "root"
    password: "${BACKYARD_PASS}"
    capabilities:
      - auto  # Auto-detect capabilities from camera
